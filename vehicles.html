const files=["vax-drag-your-march-en.png","vax-fighting-reinforcing-en.png","vax-vehicle-progression-en.png","vax-blueprint-farming-en.png"];
const key="last-z-791-language";
const requested=new URLSearchParams(location.search).get("lang");
let saved;try{saved=localStorage.getItem(key)}catch{}
const valid=k=>Object.hasOwn(labels,k);
const lang=[requested,saved,(navigator.language||"en").split("-")[0],"en"].find(valid);
try{localStorage.setItem(key,lang)}catch{}
document.documentElement.lang=lang==="zh"?"zh-Hans":lang;
document.documentElement.dir=lang==="ar"?"rtl":"ltr";
document.title=labels[lang][0]+" · VAX Academy";

document.querySelector('.language[href="?lang='+lang+'"]').setAttribute("aria-current","true");
document.querySelector(".gallery").setAttribute("aria-label",labels[lang][0]);
files.forEach((file,i)=>{
const a=document.createElement("a"),img=document.createElement("img"),caption=document.createElement("span"),title=document.createElement("span"),small=document.createElement("small");
a.className="poster";a.href="./"+file.replace("-en.png","-"+lang+".png");
img.src=a.href;img.alt=labels[lang][i+1];img.width=1024;img.height=1536;img.loading="lazy";

});
