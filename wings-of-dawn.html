<body><header><a href="./index.html">← VAX Academy</a><span class="label" dir="ltr">SERVER 791</span></header><main><div class="label" id="season">LAST Z · SEASON 1</div><h1><bdi>Wings of Dawn</bdi></h1><nav class="languages" aria-label="Language"><a class="language" lang="en" href="?lang=en">English</a><a class="language" lang="es" href="?lang=es">Español</a><a class="language" lang="pt" href="?lang=pt">Português</a><a class="language" lang="fr" href="?lang=fr">Français</a><a class="language" lang="ro" href="?lang=ro">Română</a><a class="language" lang="de" href="?lang=de">Deutsch</a><a class="language" lang="zh-Hans" href="?lang=zh">简体中文</a><a class="language" lang="ko" href="?lang=ko">한국어</a><a class="language" lang="ar" href="?lang=ar">العربية</a></nav><section class="gallery" aria-label="Wings of Dawn"></section></main><script>const labels={"en":["English","SEASON 1","Hero Upgrades","Formations","Full size ↗"],"es":["Español","Temporada 1","Mejoras de héroes","Formaciones","Tamaño completo"],"pt":["Português","Temporada 1","Melhorias de heróis","Formações","Ver em tamanho real"],"fr":["Français","Saison 1","Amélioration des héros","Formations","Voir en taille réelle"],"ro":["Română","Sezonul 1","Îmbunătățirea eroilor","Formații","Vezi la dimensiune completă"],"de":["Deutsch","Saison 1","Helden verbessern","Aufstellungen","In voller Größe öffnen"],"zh":["简体中文","第 1 赛季","英雄培养","阵容站位","查看原图"],"ko":["한국어","시즌 1","영웅 육성","편성 배치","원본 크기로 보기"],"ar":["العربية","الموسم الأول","ترقية الأبطال","التشكيلات","افتح بالحجم الكامل"]};
const key="last-z-791-language";
const requested=new URLSearchParams(location.search).get("lang");
let saved; try {saved=localStorage.getItem(key)} catch {}
const valid=k=>Object.prototype.hasOwnProperty.call(labels,k);
const lang=[requested,saved,navigator.language.split("-")[0],"en"].find(valid);
try{if(valid(requested))localStorage.setItem(key,lang)}catch{}
document.documentElement.lang=lang==="zh"?"zh-Hans":lang;
document.documentElement.dir=lang==="ar"?"rtl":"ltr";
document.querySelector('.language[href="?lang='+lang+'"]').setAttribute("aria-current","true");
document.querySelector("#season").textContent="LAST Z · "+labels[lang][1];
const ext=lang==="en"?"png":"svg";
for(const [i,section] of ["upgrades","formations"].entries()){
 const title=labels[lang][i+2],a=document.createElement("a"),img=document.createElement("img"),label=document.createElement("span"),small=document.createElement("small");
 a.className="poster";a.href="./wings-of-dawn-"+section+"-"+lang+"."+ext;
 img.src=a.href;img.alt="Wings of Dawn · "+title;img.width=1024;img.height=1536;
 label.className="caption";label.append(title);small.textContent=labels[lang][4];label.append(small);a.append(img,label);document.querySelector(".gallery").append(a);
}</script></body></html>
