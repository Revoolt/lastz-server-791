<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Heroes &amp; Formations · VAX Academy</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#fff0dc;background:radial-gradient(ellipse at top,#41221a,#0c1014 45rem);font:16px/1.5 system-ui,sans-serif}header,main{width:min(100% - 28px,1060px);margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0}a{color:inherit}select,.back,.season{font:inherit;color:inherit;background:#1d2025;border:1px solid #8b6441;border-radius:9px;padding:10px 14px;min-height:44px;text-decoration:none}.hero{overflow:hidden;border:1px solid #8b6441;border-radius:16px;background:#10141a;text-align:center}.hero img{display:block;width:100%;height:auto}.headline{position:relative;margin-top:clamp(-64px,-5vw,-14px);padding:0 12px 18px;background:linear-gradient(transparent,#10141a 62%)}h1{font-size:clamp(1.65rem,5vw,3rem);line-height:1.12;margin:0}.seasons,.factions{display:grid;gap:10px;margin:20px 0}.seasons{grid-template-columns:repeat(5,minmax(0,1fr))}.season{text-align:center;padding-inline:4px;font-weight:800}.season[aria-current=page]{background:#ffbf60;color:#17100b}.factions{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}.faction{display:flex;align-items:center;gap:12px;padding:18px 14px;border:1px solid var(--accent);border-inline-start-width:5px;border-radius:12px;background:#161d25;text-decoration:none}.faction img{width:42px;height:42px;object-fit:contain}.faction img[hidden]{display:none}.faction span{margin-inline-start:auto;color:var(--accent)}.faction small{display:block;color:#c5ced8}.notice{padding:18px;border:1px solid #8b6441;border-radius:12px;background:#1b1e22}.faction:hover,.season:hover{filter:brightness(1.18)}:focus-visible{outline:3px solid #ffc363;outline-offset:3px}
</style></head><body>
<header><a class="back" href="./index.html" id="home">← Home</a><select id="lang" aria-label="Language / Idioma"><option value="en">English</option><option value="es">Español</option><option value="pt">Português</option><option value="fr">Français</option><option value="ro">Română</option><option value="ar">العربية</option><option value="de">Deutsch</option><option value="zh">简体中文</option><option value="ko">한국어</option></select></header>
<main><section class="hero"><img src="./vax-academy-banner.png" width="1774" height="887" alt="VAX Academy"><div class="headline"><h1 id="title">Heroes &amp; formations</h1><b>LAST Z · SERVER 791</b></div></section><nav class="seasons" id="seasons" aria-label="S1–S5"></nav><section id="panel" aria-labelledby="season-title"><h2 id="season-title"></h2><div id="cards"></div></section></main>
<script>
const copy={"en":["Heroes & formations","Season","Choose a faction","Guides for this season are coming soon.","Home","Assaulters","Shooters","Riders"],"es":["Héroes y formaciones","Temporada","Elige una facción","Las guías de esta temporada llegarán más adelante.","Inicio","Asalto","Tiradores","Jinetes"],"pt":["Heróis e formações","Temporada","Escolha uma facção","Os guias desta temporada serão adicionados em breve.","Início","Assalto","Atiradores","Cavaleiros"],"fr":["Héros et formations","Saison","Choisissez une faction","Les guides de cette saison seront ajoutés prochainement.","Accueil","Assaut","Tireurs","Cavaliers"],"ro":["Eroi și formații","Sezonul","Alege o facțiune","Ghidurile acestui sezon vor fi adăugate în curând.","Acasă","Trupe de asalt","Trăgători","Călăreți"],"de":["Helden und Aufstellungen","Saison","Wähle eine Fraktion","Die Guides für diese Saison folgen.","Startseite","Sturmtruppen","Schützen","Reiter"],"zh":["英雄与阵容","第 {n} 赛季","选择阵营","本赛季攻略即将推出。","首页","突击兵","射手","骑兵"],"ko":["영웅과 편성","시즌","진영 선택","이 시즌의 가이드는 준비 중입니다.","홈","돌격병","사수","기병"],"ar":["الأبطال والتشكيلات","الموسم","اختر فصيلًا","ستتوفر أدلة هذا الموسم قريبًا.","الرئيسية","قوات الاقتحام","الرماة","الفرسان"]};
const factions=[["Blood Rose","blood-rose","#ff607a"],["Wings of Dawn","wings-of-dawn","#68b0ff"],["Guard of Order","guard-of-order","#ffa254"]];
const key="last-z-791-language", q=new URLSearchParams(location.search), $=id=>document.getElementById(id);
let saved;try{saved=localStorage.getItem(key)}catch{}
const lang=[q.get("lang"),saved,(navigator.language||"en").split("-")[0],"en"].find(k=>Object.hasOwn(copy,k));
const season=/^[1-5]$/.test(q.get("season"))?Number(q.get("season")):1;
const a=copy[lang], seasonName=n=>a[1].includes("{n}")?a[1].replace("{n}",n):a[1]+" "+n;
document.documentElement.lang=lang==="zh"?"zh-Hans":lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
$("title").textContent=a[0];document.title=a[0]+" · VAX Academy";$("home").textContent=(lang==="ar"?"→ ":"← ")+a[4];$("lang").value=lang;
$("lang").addEventListener("change",e=>{try{localStorage.setItem(key,e.target.value)}catch{}location.search="?season="+season+"&lang="+e.target.value});
for(let n=1;n<=5;n++){const l=document.createElement("a");l.className="season";l.href="?season="+n+"&lang="+lang;l.textContent="S"+n;l.setAttribute("aria-label",seasonName(n));if(n===season)l.setAttribute("aria-current","page");$("seasons").append(l)}
$("season-title").textContent=seasonName(season)+(season===1?" · "+a[2]:"");
if(season===1){$("cards").className="factions";factions.forEach(([name,slug,color],i)=>{const l=document.createElement("a");l.className="faction";l.href="./"+slug+".html?lang="+lang;l.style.setProperty("--accent",color);l.innerHTML='<img src="https://lastz.guide/images/formations/'+slug+'.png" alt="" width="42" height="42"><div><strong><bdi>'+name+'</bdi></strong><small>'+a[5+i]+'</small></div><span aria-hidden="true">'+(lang==="ar"?"←":"→")+'</span>';l.querySelector("img").addEventListener("error",e=>e.target.hidden=true);$("cards").append(l)})}
else{const p=document.createElement("p");p.className="notice";p.textContent=a[3];$("cards").append(p)}
</script></body></html>
