<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1014">
  <title>Last Z · Server 791</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #fff3dd;
      --muted: #c4cbd1;
      --gold: #ffc36a;
      --line: #414b52;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(ellipse at top, #36291e, #0c1014 44rem);
      color: var(--ink);
      font: 16px/1.5 system-ui, sans-serif;
    }
    header, main, footer {
      max-width: 1110px;
      margin: auto;
      padding-inline: clamp(12px, 3vw, 26px);
    }
    header {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      background: #141b21;
      border-inline-start: 4px solid var(--gold);
      padding: 8px 12px;
      letter-spacing: .12em;
    }
    select {
      min-height: 44px;
      max-width: 52%;
      padding: 6px 12px;
      color: var(--ink);
      background: #161e25;
      border: 1px solid #8d7049;
      border-radius: 8px;
      font: inherit;
    }
    .hero {
      position: relative;
      overflow: hidden;
      min-height: clamp(360px, 45vw, 520px);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: clamp(20px, 6vw, 64px);
      border: 1px solid #9b7547;
      border-radius: 18px;
      background:
        linear-gradient(0deg, #080b0ff7 3%, #080b0f94 40%, #080b0f12 83%),
        url("./lastz-command.png") 72% center / cover no-repeat #262a2d;
      box-shadow: 0 18px 50px #0009;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 5px;
      background: repeating-linear-gradient(135deg, #e9a746 0 9px, #25221e 9px 18px);
    }
    .tag {
      color: var(--gold);
      font-size: .8rem;
      font-weight: 850;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      margin: .12em 0;
      font-size: clamp(2.75rem, 9vw, 6rem);
      font-weight: 950;
      line-height: 1.02;
      text-transform: uppercase;
      text-shadow: 0 4px 22px #000;
    }
    .hero p {
      margin: 5px 0 0;
      max-width: 34rem;
      text-shadow: 0 2px 8px #000;
    }
    .quick {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 20px;
    }
    .quick a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 8px 15px;
      border: 1px solid var(--gold);
      border-radius: 8px;
      background: var(--gold);
      color: #17110a;
      font-weight: 800;
      text-decoration: none;
    }
    .quick a + a { color: var(--ink); background: #141a20; }
    .quick a:hover { filter: brightness(1.15); }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    h2 {
      margin: 34px 0 13px;
      padding-inline-start: 12px;
      border-inline-start: 4px solid var(--gold);
      scroll-margin-top: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
      gap: 12px;
    }
    .card {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      padding: 16px;
      background: linear-gradient(135deg, #283139, #141a20 78%);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 8px 20px #0005;
    }
    .card img {
      flex: 0 0 54px;
      width: 54px;
      height: 54px;
      padding: 5px;
      object-fit: contain;
      background: #0d1319;
      border: 1px solid #ffc36a55;
      border-radius: 9px;
    }
    .card h3 { margin: 2px 0; font-size: 1.06rem; }
    .card p { margin: 0; color: var(--muted); }
    .faction {
      border-inline-start: 4px solid var(--accent);
      background: linear-gradient(
        130deg, color-mix(in srgb, var(--accent) 20%, #161c22), #141a20
      );
    }
    footer { padding-block: 27px; color: var(--muted); font-size: .9rem; }
    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      .hero { background-position: 77% center; }
    }
    @media (prefers-reduced-motion: no-preference) {
      html { scroll-behavior: smooth; }
    }
      #guides { gap: 14px; }
    #guides .card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      align-items: flex-end;
      min-height: 185px;
      aspect-ratio: 1.6;
      border-color: #9a6d3f;
      background: #141a20;
    }
    #guides .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      aspect-ratio: 1;
      background: url("./vax-guide-cards.png") var(--x) var(--y) / 300% 200% no-repeat;
      pointer-events: none;
    }
    #guides .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, #090c10 0%, #090c10cf 24%, transparent 80%);
      pointer-events: none;
    }
    #guides .card > div { position: relative; z-index: 1; }
    #guides .card > img { display: none; }
    #guides .card h3 { overflow-wrap: anywhere; text-shadow: 0 2px 8px #000; }
    #guides .card:nth-child(1) { --x: 0%; --y: 0%; }
    #guides .card:nth-child(2) { --x: 50%; --y: 0%; }
    #guides .card:nth-child(3) { --x: 100%; --y: 0%; }
    #guides .card:nth-child(4) { --x: 0%; --y: 100%; }
    #guides .card:nth-child(5) { --x: 50%; --y: 100%; }
    #guides .card:nth-child(6) { --x: 100%; --y: 100%; }
  .hero{display:block;min-height:0;padding:0;background:#0b0d11;border-color:#824537}
.masthead{display:block;width:100%;height:auto}
.hero-copy{position:relative;margin-top:clamp(-100px,-7vw,-24px);padding:0 clamp(16px,5vw,52px) clamp(18px,4vw,40px);text-align:center;background:linear-gradient(transparent,#0b0d11 54%)}
.hero-copy h1{font-size:clamp(1.55rem,4vw,3.1rem)}
.hero-copy p{margin-inline:auto}
.hero-copy .quick{justify-content:center}
a.card{color:inherit;text-decoration:none}a.card:hover{border-color:var(--gold);filter:brightness(1.12)}
a.card::after{content:"→";margin-inline-start:auto;color:var(--gold);font-weight:900} #guides a.card::after{display:none}.pending{color:var(--gold);display:block;margin-top:3px}</style>
</head>
<body>
  <header>
    <strong class="brand" dir="ltr">VAX ACADEMY</strong>
    <select id="language" aria-label="Language">
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="pt">Português</option>
      <option value="fr">Français</option>
      <option value="ro">Română</option>
      <option value="ar">العربية</option>
      <option value="de">Deutsch</option>
      <option value="zh">简体中文</option>
      <option value="ko">한국어</option>
    </select>
  </header>

  <main>
    <section class="hero"><img class="masthead" src="./vax-academy-banner.png" width="1774" height="887" alt="VAX Academy" fetchpriority="high"><div class="hero-copy">
      <span class="tag" id="tag">Community field guide</span>
      <h1 id="title">Server 791</h1>
      <p id="intro">Build your HQ, prepare for events and learn how to fight.</p>
      <nav class="quick">
        <a id="go-guides" href="#guide-title">Guide topics</a>
        <a id="go-factions" href="./heroes.html">Season 1 factions</a>
      </nav></div>
    </section>

    <h2 id="guide-title">Guide topics</h2>
    <section class="grid" id="guides" aria-labelledby="guide-title"></section>


  </main>

  <footer id="footer">Unofficial Last Z community guide</footer>

  <script>
    const translations = {
      en: ["Language","Community field guide","Server 791","Build your HQ, prepare for events and learn how to fight.","Guide topics","Season 1 factions","Unofficial Last Z community guide","HQ requirements & research|Events & rewards|Vehicles & combat|Heroes & formations|Troops & resources|Glossary","Assaulters|Shooters|Riders"],
      es: ["Idioma","Guía de la comunidad","Servidor 791","Mejora tu HQ, prepara los eventos y aprende a combatir.","Temas de la guía","Facciones de la temporada 1","Guía no oficial de la comunidad de Last Z","Requisitos del HQ e investigación|Eventos y recompensas|Vehículos y combate|Héroes y formaciones|Tropas y recursos|Glosario","Asalto|Tiradores|Jinetes"],
      pt: ["Idioma","Guia da comunidade","Servidor 791","Melhore seu QG, prepare-se para os eventos e aprenda a lutar.","Tópicos do guia","Facções da temporada 1","Guia não oficial da comunidade de Last Z","Requisitos do QG e pesquisa|Eventos e recompensas|Veículos e combate|Heróis e formações|Tropas e recursos|Glossário","Assalto|Atiradores|Cavaleiros"],
      fr: ["Langue","Guide communautaire","Serveur 791","Améliorez votre QG, préparez les événements et apprenez à combattre.","Rubriques du guide","Factions de la saison 1","Guide communautaire non officiel de Last Z","Prérequis du QG et recherche|Événements et récompenses|Véhicules et combat|Héros et formations|Troupes et ressources|Glossaire","Assaut|Tireurs|Cavaliers"],
      ro: ["Limbă","Ghidul comunității","Serverul 791","Dezvoltă-ți baza, pregătește-te pentru evenimente și învață să lupți.","Secțiunile ghidului","Facțiunile sezonului 1","Ghid neoficial al comunității Last Z","Cerințe HQ și cercetare|Evenimente și recompense|Vehicule și luptă|Eroi și formații|Trupe și resurse|Glosar","Trupe de asalt|Trăgători|Călăreți"],
      ar: ["اللغة","دليل المجتمع","الخادم 791","طوّر مقرّك واستعد للفعاليات وتعلّم القتال.","أقسام الدليل","فصائل الموسم الأول","دليل غير رسمي لمجتمع Last Z","متطلبات المقر والأبحاث|الفعاليات والمكافآت|المركبات والقتال|الأبطال والتشكيلات|القوات والموارد|المصطلحات","قوات الاقتحام|الرماة|الفرسان"],
      de: ["Sprache","Community-Leitfaden","Server 791","Baue dein HQ aus, bereite dich auf Events vor und lerne zu kämpfen.","Themen","Fraktionen der ersten Saison","Inoffizieller Community-Leitfaden für Last Z","HQ-Voraussetzungen und Forschung|Events und Belohnungen|Fahrzeuge und Kampf|Helden und Formationen|Truppen und Ressourcen|Glossar","Sturmtruppen|Schützen|Reiter"],
      zh: ["语言","社区攻略","791 服","升级总部、备战活动，掌握战斗技巧。","攻略主题","第 1 赛季阵营","Last Z 非官方社区攻略","总部升级条件与科技研究|活动与奖励|载具与战斗|英雄与阵容|部队与资源|术语表","突击兵|射手|骑兵"],
      ko: ["언어","커뮤니티 가이드","791 서버","본부를 강화하고 이벤트에 대비하며 전투를 배워 보세요.","가이드 주제","시즌 1 진영","Last Z 비공식 커뮤니티 가이드","본부 업그레이드 조건과 연구|이벤트와 보상|차량과 전투|영웅과 편성|병력과 자원|용어집","돌격병|사수|기병"]
    };

    const discord = id => `https://discord.com/assets/${id}.svg`;
    const topics = [
      ["HQ / TECH", discord("e7f086418e908e40")],
      ["VS / FP / SvS", discord("51cc7794c9a923de")],
      ["VEHICLES / PvP", discord("136310de891799f5")],
      ["S1", "https://lz.qyjoy.vip/icons/heroes/katrina.png"],
      ["T1–T10 / RSS", discord("f47303e69e4ed29d")],
      ["RF / TP / RTP / EB", discord("7ba122c696e2d432")]
    ];
    const factions = [
      ["Blood Rose", "blood-rose", "#ff647d"],
      ["Wings of Dawn", "wings-of-dawn", "#6bacff"],
      ["Guard of Order", "guard-of-order", "#ff9b4f"]
    ];
    const $ = id => document.getElementById(id);

    function card(icon, title, tag, detail, accent) {
      const article = document.createElement("article");
      article.className = accent ? "card faction" : "card";
      if (accent) article.style.setProperty("--accent", accent);

      const img = document.createElement("img");
      img.src = icon;
      img.alt = "";
      img.loading = "lazy";
      img.width = img.height = 54;
      img.addEventListener("error", () => img.remove(), { once: true });

      const text = document.createElement("div");
      if (tag) {
        const label = document.createElement("span");
        label.className = "tag";
        label.dir = "ltr";
        label.textContent = tag;
        text.append(label);
      }
      const heading = document.createElement("h3");
      const name = document.createElement("bdi");
      name.textContent = title;
      heading.append(name);
      text.append(heading);

      if (detail) {
        const paragraph = document.createElement("p");
        paragraph.textContent = detail;
        text.append(paragraph);
      }
      article.append(img, text);
      return article;
    }

    function render(lang) {
      const [label, tag, title, intro, guides, factionTitle, footer, names, units] = translations[lang];
      document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      document.title = `Last Z · ${title}`;
      $("language").setAttribute("aria-label", label);

      Object.entries({
        tag, title, intro, footer,
        "guide-title": guides, "go-guides": guides,
        "go-factions": names.split("|")[3]
      }).forEach(([id, value]) => $(id).textContent = value);

      $("guides").replaceChildren(...names.split("|").map((name, i) => {
        const [code, icon] = topics[i];
        if (i === 3) {
          const tile = card(icon, name, code);
          const link = document.createElement("a");
          link.className = tile.className;
          link.href = "./heroes.html";
          link.append(...tile.childNodes);
          return link;
        }
        return card(icon, name, code);
      }));
    }

    const preference = "last-z-791-language";
    let lang = (navigator.language || "en").split("-")[0];
    try { lang = localStorage.getItem(preference) || lang; } catch {}
    if (!Object.prototype.hasOwnProperty.call(translations, lang)) lang = "en";
    $("language").value = lang;
    render(lang);

    $("language").addEventListener("change", event => {
      const choice = event.target.value;
      render(choice);
      try { localStorage.setItem(preference, choice); } catch {}
    });
  </script>
</body>
</html>
